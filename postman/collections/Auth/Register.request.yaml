$kind: http-request
order: 1000
method: POST
url: "{{baseUrl}}/api/auth/register"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Jane Doe",
      "email": "jane@example.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |
      pm.test("Status is 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Response has user already exists message", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.message).to.eql("User already exists with this email");
      });
